name: CI/CD Docker Build & Push

on:
  push:
    branches: [main]

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2️⃣ Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4️⃣ Build & push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          pull: true
          tags: |
            asadbook/hotel-booking-api:latest
            asadbook/hotel-booking-api:${{ github.sha }}

      # 5️⃣ Run container for smoke testing
      - name: Run container
        run: |
          docker run -d --name test-container -p 8000:8000 \
            asadbook/hotel-booking-api:latest
            
          sleep 10

          echo "=== CONTAINER STATUS ==="
          docker ps -a

          echo "=== CONTAINER LOGS ==="
          docker logs test-container

      # 6️⃣ Health check + Prediction test
      - name: Health check and prediction test
        run: |
          echo "Testing /health..."
          curl -f http://localhost:8000/health

          echo ""
          echo "Testing /predict..."

          curl -f -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{
              "hotel": "Resort Hotel",
              "lead_time": 45,
              "arrival_date_month": "July",
              "arrival_date_week_number": 27,
              "arrival_date_day_of_month": 15,
              "stays_in_weekend_nights": 1,
              "stays_in_week_nights": 2,
              "adults": 2,
              "children": 0,
              "babies": 0,
              "meal": "BB",
              "country": "PRT",
              "market_segment": "Online TA",
              "distribution_channel": "TA/TO",
              "is_repeated_guest": 0,
              "previous_cancellations": 0,
              "previous_bookings_not_canceled": 0,
              "reserved_room_type": "A",
              "assigned_room_type": "A",
              "booking_changes": 0,
              "deposit_type": "No Deposit",
              "days_in_waiting_list": 0,
              "customer_type": "Transient",
              "adr": 100.0,
              "required_car_parking_spaces": 0,
              "total_of_special_requests": 0,
              "city": "Lisbon"
            }'

      # 7️⃣ Show logs (for debugging if needed)
      - name: Show container logs
        if: always()
        run: |
          docker logs test-container || true

      # 8️⃣ Cleanup
      - name: Cleanup
        if: always()
        run: |
          docker rm -f test-container || true
